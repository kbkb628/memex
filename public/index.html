<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>memex</title>
<style>
  body { font: 15px/1.65 system-ui, -apple-system, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .hint { color: #666; font-size: 13px; margin: 0 0 20px; }
  textarea, input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
  input { margin-top: 6px; }
  button { font: inherit; font-size: 14px; padding: 6px 16px; margin-top: 8px; border: 1px solid #999; background: #fff; border-radius: 6px; cursor: pointer; }
  button:disabled { color: #aaa; border-color: #ddd; cursor: default; }
  .meta { font: 12px ui-monospace, SFMono-Regular, monospace; color: #999; margin-left: auto; text-align: right; }
  section { margin-bottom: 36px; }
  .sec-head { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #e5e5e5; padding-bottom: 6px; margin-bottom: 4px; }
  .sec-head span:first-child { font-size: 13px; }
  #ops { margin-top: 28px; }
  .op { padding: 14px 0; border-top: 1px solid #e5e5e5; }
  .state { font-size: 13px; margin-top: 2px; }
  .text { white-space: pre-wrap; margin-top: 8px; }
  .text:empty { display: none; }
  .note { padding: 14px 0; border-top: 1px solid #f0f0f0; }
  .note:first-child { border-top: none; }
  .note h3 { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
  .note h3 a { color: inherit; text-decoration: none; border-bottom: 1px solid #ddd; }
  .note p { margin: 6px 0 0; white-space: pre-wrap; font-size: 14px; }
  .note .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .note button { margin: 0; padding: 2px 10px; font-size: 12px; color: #666; }
  /* 它拒掉的：字号小一号、颜色退一档 —— 这栏是给人核对的，不是给人读的。 */
  .note.muted h3 { font-size: 13px; font-weight: 400; color: #555; }
  .note.muted h3 a { border-bottom-color: #eee; }
  .note.muted p { font-size: 13px; color: #666; }
  details { margin-top: 16px; }
  summary { font-size: 13px; color: #666; cursor: pointer; }
  .empty { color: #999; font-size: 13px; padding: 14px 0; }
</style>
</head>
<body>
<h1>memex</h1>
<p class="hint">发完可以直接关掉这个页面。它做完了，答案留在这儿，下次打开还在。</p>

<section>
  <div class="sec-head">
    <span>它替你看了什么</span>
    <span class="meta" id="inbox-meta">读不到</span>
  </div>
  <div id="inbox"></div>
  <details id="judged-wrap">
    <summary>它看过、但没给你的</summary>
    <div id="judged"></div>
  </details>
  <details>
    <summary>加一个订阅源</summary>
    <input id="feed-url" placeholder="RSS / Atom 地址，https://…">
    <input id="feed-want" placeholder="你想知道什么（一句话，比如「只报和持久执行有关的」）">
    <input id="feed-avoid" placeholder="不想要什么（可留空，比如「招聘、融资、榜单」）">
    <button id="feed-add">接入</button>
    <div class="meta" id="feed-msg" style="margin-top:8px"></div>
  </details>
</section>

<section>
  <div class="sec-head">
    <span>它自己会醒</span>
    <span class="meta" id="routines-meta">读不到</span>
  </div>
  <div id="routines"></div>
</section>

<section>
  <div class="sec-head">
    <span>它还在推进什么</span>
    <span class="meta" id="goals-meta">读不到</span>
  </div>
  <div id="goals"></div>
  <details>
    <summary>交给它一件要做几轮的事</summary>
    <input id="goal-objective" placeholder="目标：一句话说清做成什么样">
    <input id="goal-criteria" placeholder="完成条件，一行一条。要机器验的写成 answer_contains:那句话">
    <button id="goal-add">开始</button>
    <div class="meta" id="goal-msg" style="margin-top:8px"></div>
  </details>
</section>

<section>
  <textarea id="in" rows="3" placeholder="说一句话"></textarea>
  <button id="send">发送</button>
  <div id="ops"></div>
</section>

<script>
  const STORE = "agent.ops";
  const list = () => { try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch { return []; } };
  const keep = (id) => localStorage.setItem(STORE, JSON.stringify([id, ...list().filter((x) => x !== id)].slice(0, 20)));

  const $ = (sel) => document.querySelector(sel);

  // ── token：服务端配了 ACCESS_TOKENS 之后，所有请求都要带 ──────────
  // 从 ?token= 取一次就记住，然后把地址栏那一截抹掉 —— 免得截图、录屏、
  // 浏览器历史里到处躺着它。没配 token 的部署（本地 dev）走单用户模式，这里为空，
  // 不带 Authorization 头，行为和以前完全一样。
  {
    const params = new URLSearchParams(location.search);
    const fromUrl = params.get("token");
    if (fromUrl) {
      localStorage.setItem("agent.token", fromUrl);
      params.delete("token");
      const rest = params.toString();
      history.replaceState(null, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
    }
  }
  const TOKEN = localStorage.getItem("agent.token") || "";
  const api = (path, init = {}) =>
    fetch(path, {
      ...init,
      headers: { ...(init.headers || {}), ...(TOKEN ? { authorization: "Bearer " + TOKEN } : {}) },
    });

  // 四万两千 token 写成「4.2 万」，一个数字能读完才好比较。
  const tokens = (n) => (n >= 10000 ? (n / 10000).toFixed(1) + " 万" : String(n));
  // 一次任务常常是几厘钱，四舍五入到分就全变成 0 了，所以留四位。
  // 写「估算」不是谦虚：这个数是 SDK 按报价表算的，不是账单，也没有汇率和阶梯价。
  const money = (usd) => (usd > 0 ? "（估算 $" + usd.toFixed(4) + "）" : "");

  // ── 收件箱：它自己看来的东西 ──────────────────────────────
  async function loadInbox() {
    let body;
    try {
      const res = await api("/inbox");
      // 401 和「连不上」是两件事：一个是门锁着，一个是网络不通。
      // 混成一句「连不上」会让人去查网络，而问题其实在这个链接上。
      if (res.status === 401) {
        $("#inbox-meta").textContent = "这个链接没有 token";
        return;
      }
      body = await res.json();
    } catch {
      $("#inbox-meta").textContent = "连不上";
      return;
    }
    if (body.error) { $("#inbox-meta").textContent = body.error; return; }

    const st = await api("/status").then((r) => r.json()).catch(() => ({}));
    const parts = [];
    if (typeof body.unread === "number") parts.push(body.unread + " 条值得看");
    if (typeof body.skipped === "number") parts.push("跳过 " + body.skipped);
    // 失败单独露面，哪怕只有 1 条。只写「跳过 N」的时候，一个抓不到的源
    // 和「今天没有新东西」在页面上长得一模一样。
    if (typeof body.failed === "number" && body.failed > 0) parts.push("失败 " + body.failed);
    if (st.budget) {
      const b = st.budget;
      // 上限只拦"它自己看"的部分，所以分开说：前面是你今天真实提交的总数，
      // 括号里那组才是闸门。混成一个「5/20」会让手动发的消息无处安放。
      const n = typeof b.total === "number" ? b.total : b.used;
      parts.push("今天 " + n + " 次 · 自动 " + b.used + "/" + b.limit);
    }
    // 口径写死成「累计」：预算那个数是按天的，这个数是从头算的，混着说就是撒谎。
    // 算不出来就明说，不要不吭声 —— 不吭声会被读成「没花过钱」。
    if (st.spend && st.spend.error) parts.push("用量读不到");
    else if (st.spend && st.spend.tokens > 0) {
      parts.push("累计 " + tokens(st.spend.tokens) + " token" + money(st.spend.cost));
    }
    $("#inbox-meta").textContent = parts.join(" · ") || "还没有源";

    const box = $("#inbox");
    box.innerHTML = "";
    if (!body.items || !body.items.length) {
      box.innerHTML = '<div class="empty">它会每 3 小时看一遍你配的源。上面「加一个订阅源」开始。</div>';
      return;
    }
    for (const item of body.items) {
      const el = document.createElement("div");
      el.className = "note";

      const row = document.createElement("div");
      row.className = "row";
      const h = document.createElement("h3");
      if (item.link) {
        const a = document.createElement("a");
        a.href = item.link;
        a.target = "_blank";
        a.rel = "noreferrer";
        a.textContent = item.title;
        h.appendChild(a);
      } else {
        h.textContent = item.title;
      }
      row.appendChild(h);

      const btn = document.createElement("button");
      btn.textContent = "知道了";
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        await api("/inbox/read", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ id: item.id }),
        }).catch(() => {});
        el.remove();
        loadInbox();
      });
      row.appendChild(btn);
      el.appendChild(row);

      const p = document.createElement("p");
      p.textContent = item.note || "";
      el.appendChild(p);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.style.marginTop = "6px";
      // 谁判的。看一条判断时第一个想问的就是这个 —— 换过模型之后，
      // 不写这一句，新旧判定混在一起就看不出差异是模型带来的还是材料带来的。
      meta.textContent = item.model ? item.feed + " · " + item.model : item.feed;
      el.appendChild(meta);

      box.appendChild(el);
    }
  }

  // ── 核对：它拒掉的那些，和拒掉的理由 ──────────────────────
  //
  // 收件箱只放「进来了的」，可「没进来的」才是判断力的证据 —— 一条被正确
  // 拒掉的噪音，比十条收进来的更能说明它在工作。这里默认不展开、也不发请求：
  // 它是核对视图，不是日常读物。
  //
  // 只取 skipped / failed。pending 是「还没结算」，把它列进「拒掉的」是撒谎。
  const stamp = (ms) => {
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, "0");
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  };

  async function loadJudged() {
    const box = $("#judged");
    box.innerHTML = '<div class="empty">正在读…</div>';

    let body;
    try {
      const res = await api("/inbox?all=1");
      if (res.status === 401) { box.innerHTML = '<div class="empty">这个链接没有 token</div>'; return; }
      body = await res.json();
    } catch {
      box.innerHTML = '<div class="empty">连不上</div>';
      return;
    }

    const others = (body.items || []).filter((i) => i.state === "skipped" || i.state === "failed");
    box.innerHTML = "";
    if (!others.length) {
      box.innerHTML = '<div class="empty">还没有拒过任何一条。</div>';
      return;
    }

    for (const item of others) {
      const el = document.createElement("div");
      el.className = "note muted";

      const h = document.createElement("h3");
      if (item.link) {
        const a = document.createElement("a");
        a.href = item.link;
        a.target = "_blank";
        a.rel = "noreferrer";
        a.textContent = item.title;
        h.appendChild(a);
      } else {
        h.textContent = item.title;
      }
      el.appendChild(h);

      const v = item.verdict;
      const p = document.createElement("p");
      p.textContent = (v && v.why) || item.note || "（没留下理由 —— 这条该补上）";
      el.appendChild(p);

      // 两件它自己说不清、只有服务端知道的事：给了多少材料、理由里有没有点名。
      // 前者区分「读了正文才判」和「只看见标题就判」；后者区分「照口径跳的」
      // 和「含糊跳的」。都没有的话不硬凑一行。
      const bits = [];
      if (v && typeof v.givenChars === "number") bits.push("材料 " + v.givenChars + " 字");
      if (v && v.cited && v.cited.length) {
        bits.push("提到「" + v.cited.join(" / ") + "」");
      }
      // 指纹是给「过几天回来核对」用的：材料会变（源改标题、换摘要），而判定留着。
      // 重算一次，一样才说明你眼前这条就是它当时判的那份 —— 否则你其实在评价另一条。
      if (item.fp) bits.push("fp " + item.fp);
      if (item.model) bits.push(item.model);
      bits.push(item.feed, item.state === "failed" ? "没跑通" : "跳过", stamp(item.at));

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.style.marginTop = "6px";
      meta.textContent = bits.join(" · ");
      el.appendChild(meta);

      box.appendChild(el);
    }
  }

  $("#judged-wrap").addEventListener("toggle", (e) => {
    if (e.target.open) loadJudged();
  });

  // ── 它自己会醒 ────────────────────────────────────────────
  //
  // 这一栏只回答一个问题：我没有打开这个页面的时候，它在不在跑。
  // 所以每条都得给出「多久一次、上次什么时候、那次做了什么、下次什么时候」。
  // 只写「运行中」等于什么都没说 —— 那和「上个月跑过一次」在页面上长得一样。
  const ago = (ms) => {
    const d = Date.now() - ms;
    if (d < 0) return "还没到";
    const m = Math.floor(d / 60000);
    if (m < 1) return "刚刚";
    if (m < 60) return m + " 分钟前";
    const h = Math.floor(m / 60);
    return h < 24 ? h + " 小时前" : Math.floor(h / 24) + " 天前";
  };
  const ahead = (ms) => {
    const d = ms - Date.now();
    if (d <= 0) return "随时会跑";
    const m = Math.round(d / 60000);
    if (m < 60) return m + " 分钟后";
    const h = Math.round(m / 60);
    return h < 24 ? h + " 小时后" : Math.round(h / 24) + " 天后";
  };
  const every = (ms) => {
    if (ms < 3600000) return "每 " + Math.round(ms / 60000) + " 分钟";
    const h = ms / 3600000;
    return h < 24 ? "每 " + h + " 小时" : "每天";
  };

  function routineCard(r) {
    const el = document.createElement("div");
    el.className = "note";

    const row = document.createElement("div");
    row.className = "row";
    const h = document.createElement("h3");
    h.textContent = r.title;
    row.appendChild(h);
    const badge = document.createElement("span");
    badge.className = "meta";
    badge.textContent = every(r.everyMs);
    row.appendChild(badge);
    el.appendChild(row);

    const last = r.last;
    if (!last) {
      const p = document.createElement("p");
      p.textContent = "还没跑过。";
      el.appendChild(p);
    } else {
      const facts = [];
      if (r.id === "ingest") {
        facts.push(last.feeds + " 个源", "新 " + last.fresh, "提交 " + last.submitted);
        if (last.skipped) facts.push("跳过 " + last.skipped);
      } else {
        facts.push("扫 " + last.scanned + " 条");
        if (last.retried.length) facts.push("重试 " + last.retried.length);
        if (last.goals.length) facts.push("推进目标 " + last.goals.length);
        if (!last.retried.length && !last.goals.length) facts.push("没有要动的东西");
      }
      const p = document.createElement("p");
      p.textContent = "上次 " + ago(last.at) + " · " + facts.join(" · ");
      el.appendChild(p);

      // 出错和卡住单独一行、变红。混在事实里会被一眼扫过去，
      // 而这两样恰恰是「它已经不再工作了」唯一会留下的痕迹。
      const bad = [];
      if (r.id === "ingest" && last.failed && last.failed.length) {
        bad.push("没拉到 " + last.failed.map((f) => f.feed + "（" + f.error + "）").join("、"));
      }
      if (r.id === "patrol" && last.stuck && last.stuck.length) {
        bad.push("卡住 " + last.stuck.length + " 个：" + last.stuck.join("、"));
      }
      if (bad.length) {
        const warn = document.createElement("p");
        warn.style.color = "#b00";
        warn.textContent = bad.join("｜");
        el.appendChild(warn);
      }
    }

    if (r.next) {
      const n = document.createElement("div");
      n.className = "meta";
      n.style.marginTop = "6px";
      n.textContent = "下次 " + ahead(r.next);
      el.appendChild(n);
    }
    return el;
  }

  async function loadRoutines() {
    const box = $("#routines");
    let body;
    try {
      const res = await api("/routines");
      if (res.status === 401) { $("#routines-meta").textContent = "这个链接没有 token"; return; }
      body = await res.json();
    } catch {
      $("#routines-meta").textContent = "连不上";
      return;
    }
    const list = body.routines || [];
    if (!list.length) {
      $("#routines-meta").textContent = "没有定时动作";
      box.innerHTML = "";
      return;
    }
    const soonest = list.filter((r) => r.next).sort((a, b) => a.next - b.next)[0];
    $("#routines-meta").textContent = list.length + " 条定时" + (soonest ? " · 下一次 " + ahead(soonest.next) : "");
    box.innerHTML = "";
    for (const r of list) box.appendChild(routineCard(r));
  }

  async function addFeed() {
    const url = $("#feed-url").value.trim();
    const want = $("#feed-want").value.trim();
    const avoid = $("#feed-avoid").value.trim();
    if (!url) return;
    $("#feed-add").disabled = true;
    $("#feed-msg").textContent = "正在读这个源…";

    const res = await api("/feeds", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ url, want, avoid }),
    }).catch(() => null);
    $("#feed-add").disabled = false;

    if (!res) { $("#feed-msg").textContent = "网络失败"; return; }
    if (res.status === 401) { $("#feed-msg").textContent = "这个链接没有 token"; return; }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { $("#feed-msg").textContent = body.error || ("失败 " + res.status); return; }

    $("#feed-url").value = "";
    $("#feed-want").value = "";
    $("#feed-avoid").value = "";
    $("#feed-msg").textContent = body.note || "已接入";
    loadInbox();
  }

  // ── 对话：我问的东西 ──────────────────────────────────────
  function card(id) {
    let el = document.querySelector('[data-id="' + id + '"]');
    if (el) return el;
    el = document.createElement("div");
    el.className = "op";
    el.dataset.id = id;
    el.innerHTML = '<div class="meta"></div><div class="state"></div><div class="text"></div>';
    $("#ops").prepend(el);
    return el;
  }

  function show(id, state, text) {
    const el = card(id);
    el.querySelector(".meta").textContent = id;
    el.querySelector(".state").textContent = state;
    el.querySelector(".text").textContent = text || "";
  }

  async function poll(id) {
    let body;
    try {
      const res = await api("/op?id=" + encodeURIComponent(id));
      if (res.status === 401) return show(id, "这个链接没有 token");
      if (res.status === 404) return show(id, "服务端不认识这张回执（库可能被清过）");
      body = await res.json();
    } catch {
      return show(id, "连不上，稍后重试");
    }

    if (body.error) return show(id, body.error);
    if (body.live) {
      show(id, "运行中（" + body.status + "）");
      return setTimeout(() => poll(id), 1500);
    }
    if (body.status === "done") return show(id, "已完成", body.text);
    if (body.status === "unanswered") return show(id, "没答上来：" + (body.reason || "未知原因"));
    show(id, "状态：" + (body.status || "未知"));
  }

  async function send() {
    const text = $("#in").value.trim();
    if (!text) return;

    const operationId = crypto.randomUUID();
    keep(operationId);
    show(operationId, "已受理，模型还没开始跑");
    $("#in").value = "";

    const res = await api("/submit", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, operationId }),
    }).catch(() => null);

    if (!res) return show(operationId, "网络失败，这张回执还留着，刷新会继续查");
    if (res.status === 401) return show(operationId, "这个链接没有 token");
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      return show(operationId, err.hint || err.error || "提交失败 " + res.status);
    }
    poll(operationId);
  }

  // ── 目标：一句话说不完的事 ────────────────────────────────
  //
  // 页面上最重要的一行不是「已完成」，是每一条条件后面的那个 ✓ 或 ·。
  // 模型的答案只有一份，而条件是判定它做完没有的依据 —— 把条件摆出来，
  // 人才有办法发现「它说做完了，但其实只满足了第一条」。
  const GOAL_STATE = {
    running: "推进中",
    waiting: "等人确认",
    done: "已完成",
    failed: "停下来了",
    cancelled: "已叫停",
  };

  async function goalAction(path, id, extra = {}) {
    const res = await api(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id, ...extra }),
    }).catch(() => null);
    if (!res) return null;
    return await res.json().catch(() => ({}));
  }

  async function loadGoals() {
    const box = $("#goals");
    const res = await api("/goals").catch(() => null);
    if (!res || !res.ok) {
      $("#goals-meta").textContent = res && res.status === 401 ? "这个链接没有 token" : "连不上";
      return;
    }
    const body = await res.json().catch(() => ({}));
    const goals = body.goals || [];
    const open = goals.filter((g) => g.status === "running" || g.status === "waiting").length;
    $("#goals-meta").textContent = goals.length ? `${open} 个在推 / 共 ${goals.length} 个` : "没有";

    box.innerHTML = "";
    if (!goals.length) {
      box.innerHTML = '<div class="empty">没有目标。发一句话让它做一件一句话说不完的事。</div>';
      return;
    }
    for (const g of goals) box.appendChild(goalCard(g));
  }

  function goalCard(g) {
    const el = document.createElement("div");
    el.className = "note";

    const row = document.createElement("div");
    row.className = "row";
    const h = document.createElement("h3");
    h.textContent = g.objective;
    row.appendChild(h);

    const badge = document.createElement("span");
    badge.className = "meta";
    badge.textContent = GOAL_STATE[g.status] || g.status;
    row.appendChild(badge);
    el.appendChild(row);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.style.marginTop = "6px";
    meta.textContent = `第 ${g.runs}/${g.maxRuns} 轮 · 指纹 ${g.digest}`;
    el.appendChild(meta);

    for (const c of g.criteria) {
      const line = document.createElement("p");
      line.style.fontSize = "13px";
      // 机械条件验的是「有没有提」，人工条件验的是「说得对不对」。
      // 两种混在一个列表里，所以要标出来 —— 不然人会以为 ✓ 等于「对了」。
      const mark = c.ok ? "✓" : c.met === false ? "✗" : "·";
      const how = c.kind === "answer_contains" ? "机器验" : c.confirmed ? "已确认" : "要你看";
      line.textContent = `${mark} ${c.raw.replace(/^answer_contains[:：]\s*/i, "")}　(${how})`;
      el.appendChild(line);

      if (c.kind === "human" && !c.confirmed && g.status === "waiting") {
        const btn = document.createElement("button");
        btn.textContent = "这条我看过了";
        btn.style.margin = "4px 0 0";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await goalAction("/goals/confirm", g.id, { index: c.index });
          loadGoals();
        });
        el.appendChild(btn);
      }
    }

    if (g.endedWhy) {
      const why = document.createElement("div");
      why.className = "meta";
      why.style.marginTop = "6px";
      why.textContent = g.endedWhy;
      el.appendChild(why);
    }

    const last = g.rounds[g.rounds.length - 1];
    if (last && last.answer) {
      const p = document.createElement("p");
      p.textContent = last.answer;
      el.appendChild(p);
    }

    if (g.status === "running" || g.status === "waiting") {
      const bar = document.createElement("div");
      bar.style.marginTop = "8px";

      const push = document.createElement("button");
      push.textContent = "现在推一轮";
      push.addEventListener("click", async () => {
        push.disabled = true;
        const next = await goalAction("/goals/advance", g.id);
        loadGoals();
        if (next && next.note) $("#goal-msg").textContent = next.note;
      });
      bar.appendChild(push);

      const stop = document.createElement("button");
      stop.textContent = "叫停";
      stop.style.marginLeft = "8px";
      stop.addEventListener("click", async () => {
        stop.disabled = true;
        await goalAction("/goals/cancel", g.id);
        loadGoals();
      });
      bar.appendChild(stop);
      el.appendChild(bar);
    }
    return el;
  }

  async function addGoal() {
    const objective = $("#goal-objective").value.trim();
    const criteria = $("#goal-criteria").value.split("\n").map((s) => s.trim()).filter(Boolean);
    if (!objective) return;
    if (!criteria.length) {
      $("#goal-msg").textContent = "至少要有一条完成条件。没有条件的目标永远不会「做完」。";
      return;
    }
    $("#goal-add").disabled = true;
    $("#goal-msg").textContent = "正在起第一轮…";

    const res = await api("/goals", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ objective, criteria }),
    }).catch(() => null);
    $("#goal-add").disabled = false;

    if (!res) { $("#goal-msg").textContent = "网络失败"; return; }
    if (res.status === 401) { $("#goal-msg").textContent = "这个链接没有 token"; return; }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { $("#goal-msg").textContent = body.error || ("失败 " + res.status); return; }

    $("#goal-objective").value = "";
    $("#goal-criteria").value = "";
    $("#goal-msg").textContent = "已经起了第一轮，跑完这里会自己更新。";
    loadGoals();
  }

  $("#send").addEventListener("click", send);
  $("#goal-add").addEventListener("click", addGoal);
  $("#feed-add").addEventListener("click", addFeed);
  $("#in").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
  });

  // 页面重开时，把还没结果的回执接着问一遍 —— 这就是「关掉也不丢」在界面上那一半。
  list().forEach(poll);
  loadInbox();
  loadRoutines();
  loadGoals();
  // 它会在后台自己醒。页面开着的话，一分钟看一次有没有新东西进来。
  setInterval(() => { loadInbox(); loadRoutines(); loadGoals(); }, 60000);
</script>
</body>
</html>
