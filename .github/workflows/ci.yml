name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # worker-configuration.d.ts 不进仓库，CI 里先生成再类型检查
      - run: npx wrangler types
      - run: npm run typecheck
