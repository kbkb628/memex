name: live

# 线上档：从公网 runner 打已经部署的那个实例。
#
# 为什么不在自己的机器上跑：这台开发机到 Cloudflare 边缘是整体不通的 ——
# 本地 DNS 把 *.workers.dev 污染到 108.160.165.212，绕过 DNS 直接打真实 IP
# 173.255.209.47 也超时，另外试的五个边缘 IP 全是 000。所以「部署后的真实请求」
# 这一档只能换个网络发起，而 runner 就是现成的公网发起方。
#
# 手动触发，不进 push 流程：它打的是线上实例、会花真 token，不该每次提交都跑。

on:
  workflow_dispatch:
    inputs:
      base:
        description: 线上地址（不带 token）
        required: false
        default: https://personal-agent.kbkb628.workers.dev
      skip_goal:
        description: 跳过目标那一节（线上还是旧版本时用）
        type: boolean
        default: false
      sync_want:
        description: 把代码里的 want 推到线上已有的源（改口径时给一次 true）
        type: boolean
        default: false
      migrate_sources:
        description: 把线上的源换成代码里的默认源（只在改过默认源时给一次 true）
        type: boolean
        default: false
      run_ingest:
        description: 让线上当场跑一轮抓取（换过源之后用它证明打得到，不等下一次定时）
        type: boolean
        default: false
      swap_sources:
        description: 换 HN 那三个源的取数地址（hnrss 已不可用；会重建基线）
        type: boolean
        default: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # 不用 npm ci：脚本只用 node 自带的 fetch，不碰依赖。
      # 少一步依赖安装，这一档就少一种「因为装不上所以没验」的失败方式。
      # 默认源只在第一次开机写进 cfg:feeds，之后改了代码也不会变。
      # 这一步给的就是「够不到那台机器时，怎么把源换掉」的办法。
      - name: 换源
        if: ${{ inputs.migrate_sources }}
        env:
          BASE: ${{ inputs.base }}
          MEMEX_TOKEN: ${{ secrets.MEMEX_TOKEN }}
        run: node scripts/sources.mjs --drop https://hnrss.org/frontpage --add-defaults

      # 2026-11-10：hnrss 三个订阅一起 502 了一整天，线上 worker 打过去也是 502，
      # 于是实例连着几轮 `fresh: 0` 而页面上只写着「定时器正常」。
      # 源要的东西没变，变的是取数的路 —— 所以换地址、不新增源。
      # 旧的那个必须显式删掉：留着它每轮巡检继续记一条「抓不到」，
      # 而「有源在坏」这个信号从此就不再有任何信息量。
      - name: 换 HN 的取数地址
        if: ${{ inputs.swap_sources }}
        env:
          BASE: ${{ inputs.base }}
          MEMEX_TOKEN: ${{ secrets.MEMEX_TOKEN }}
        run: |
          node scripts/sources.mjs --drop 'https://hnrss.org/newest?q=%22durable+objects%22&points=20' || true
          node scripts/sources.mjs --migrate --apply

      # 改口径：线上源的 want 存在 Durable Object 里，改代码不会动它。
      # 这一步只在「代码里的口径变了」时用一次，平时别开。
      - name: 同步口径
        if: ${{ inputs.sync_want }}
        env:
          BASE: ${{ inputs.base }}
          MEMEX_TOKEN: ${{ secrets.MEMEX_TOKEN }}
        run: node scripts/sources.mjs --sync-want --apply

      - name: 从公网打线上实例
        env:
          BASE: ${{ inputs.base }}
          MEMEX_TOKEN: ${{ secrets.MEMEX_TOKEN }}
          SKIP_GOAL: ${{ inputs.skip_goal && '1' || '0' }}
          RUN_INGEST: ${{ inputs.run_ingest && '1' || '0' }}
          OUT: receipts/live.json
        run: node scripts/live-check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-receipt
          path: receipts/live.json
          if-no-files-found: warn
